<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Enquiry | Golden Crust Bakery</title>
<meta name="description" content="Golden Crust Bakery in Riverdale: handcrafted sourdough, pastries and custom celebration cakes.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="site-header">
<a class="brand" href="index.html">Golden Crust Bakery</a>
<nav aria-label="Main"><ul class="nav"><li><a href="index.html">Home</a></li><li><a href="about.html">About Us</a></li><li><a href="products.html">Products</a></li><li><a href="enquiry.html" aria-current="page">Enquiry</a></li><li><a href="contact.html">Contact</a></li></ul></nav>
</header>
<main>
<section class="section narrow">
<h1>Custom and bulk order enquiry</h1>
<p>Tell us what you need and we will reply within two working days.</p>
<form class="form" action="#" method="post">
<label for="name">Full name</label>
<input id="name" name="name" type="text" required autocomplete="name">
<label for="email">Email address</label>
<input id="email" name="email" type="email" required autocomplete="email">
<label for="phone">Phone number</label>
<input id="phone" name="phone" type="tel" pattern="[0-9 +]{10,15}" title="Enter 10 to 15 digits" autocomplete="tel">
<label for="type">Order type</label>
<select id="type" name="type" required><option value="">Choose one</option><option>Custom cake</option><option>Bulk bread order</option><option>Event catering</option></select>
<label for="date">Date needed</label>
<input id="date" name="date" type="date">
<label for="details">Details</label>
<textarea id="details" name="details" rows="5" required minlength="10"></textarea>
<button class="btn" type="submit">Send enquiry</button>
</form>
</section>
</main>
<footer class="site-footer">
<p>&copy; 2026 Golden Crust Bakery, Riverdale. Baking since 2013.</p>
<p><a href="enquiry.html">Order a custom cake</a></p>
</footer>
</body>
</html>
